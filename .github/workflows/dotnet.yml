# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
    - name: Organise Build Artifacts
      run: |
        mv ParseTimeshiftSnapshots/bin/Release/net10.0/ParseTimeshiftSnapshots ParseTimeshiftSnapshots
        mv ParseTimeshiftSnapshots/bin/Release/net10.0/ParseTimeshiftSnapshots.dll ParseTimeshiftSnapshots.dll
        mv ParseTimeshiftSnapshots/bin/Release/net10.0/ParseTimeshiftSnapshots.runtimeconfig.json ParseTimeshiftSnapshots.runtimeconfig.json
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: |
          ParseTimeshiftSnapshots
          ParseTimeshiftSnapshots.dll
          ParseTimeshiftSnapshots.runtimeconfig.json
          Backup.sh
